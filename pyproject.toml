[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wuwaterm-client"
version = "0.4.2"
description = "Windows desktop client for the WuwaTerm HTTP API."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Peter" }]
# Not published: this classifier makes PyPI/Warehouse reject an upload, and
# this package is never added to the wuwaterm server wheel (it has its own
# pyproject.toml here in client/, outside src/).
classifiers = [
  "Private :: Do Not Upload",
]
dependencies = [
  "PySide6>=6.7,<7",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "qasync>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  # Read by tests/test_dependency_advisories.py, which asserts the dependency
  # audit's trigger list, its pinned scanner and its artifact upload rather
  # than trusting a workflow nobody re-reads.
  "PyYAML>=6.0,<7",
]
build = [
  "pyinstaller>=6.10,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-config --strict-markers"

[tool.setuptools.package-data]
wuwaterm_client = ["resources/*.qss", "resources/icons/*"]
