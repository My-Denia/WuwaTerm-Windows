name: CI
# Documentation-only changes cannot reach runtime behaviour, contracts,
# dependencies or the packaged executable, so they skip the Windows upload and
# build: #17 changed one README line and spent 14m47s on windows-latest. A
# release always bumps the version in pyproject.toml and
# src/wuwaterm_client/__init__.py, which are not ignored, so a release source
# keeps its own full run. workflow_dispatch keeps a full run available for a
# documentation commit that skipped its push run; release.yml accepts that run
# through scripts/verify_ci_source.py.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'README.*.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'provenance/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'README.*.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'provenance/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pure:
    name: Pure manuscript contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Resolve pinned Core and Web sources
        id: pins
        run: |
          echo "core=$(python -c 'import json; print(json.load(open("contracts/sources.json"))["core"]["commit"])')" >> "$GITHUB_OUTPUT"
          echo "web=$(python -c 'import json; print(json.load(open("contracts/sources.json"))["web"]["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: My-Denia/WuwaTerm
          ref: ${{ steps.pins.outputs.core }}
          path: .contract-sources/core
      - uses: actions/checkout@v7
        with:
          repository: My-Denia/WuwaTerm-Web
          ref: ${{ steps.pins.outputs.web }}
          path: .contract-sources/web
      - run: python -m pip install pytest==8.4.2
      - name: Run without desktop dependencies
        env:
          PYTHONPATH: src
          WUWATERM_CORE_ROOT: ${{ github.workspace }}/.contract-sources/core
          WUWATERM_WEB_ROOT: ${{ github.workspace }}/.contract-sources/web
          WUWATERM_CONTRACTS_REQUIRED: '1'
        run: |
          python -c "import importlib.util as u; assert u.find_spec('PySide6') is None and u.find_spec('keyring') is None"
          python -m pytest tests/test_manuscript.py tests/test_segmentation.py tests/test_semantic_contract.py tests/test_pyinstaller_version_info.py
  windows:
    name: Windows build and contracts
    uses: ./.github/workflows/windows-build.yml
    with:
      source_commit: ${{ github.sha }}
