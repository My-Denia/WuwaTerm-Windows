name: Windows build
on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    name: build and test
    runs-on: windows-latest
    # Apply before every checkout, including the pinned external repositories.
    # Windows Git defaults to CRLF, but the contract and icon checks compare
    # committed bytes. Keep this scoped to this job, not the runner's config.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
      - name: Confirm source
        shell: bash
        env:
          SOURCE: ${{ inputs.source_commit }}
        run: |
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Resolve pinned Core and Web sources
        id: pins
        shell: pwsh
        run: |
          $pins = Get-Content contracts/sources.json -Raw | ConvertFrom-Json
          "core=$($pins.core.commit)" >> $env:GITHUB_OUTPUT
          "web=$($pins.web.commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v7
        with:
          repository: My-Denia/WuwaTerm
          ref: ${{ steps.pins.outputs.core }}
          path: .contract-sources/core
      - uses: actions/checkout@v7
        with:
          repository: My-Denia/WuwaTerm-Web
          ref: ${{ steps.pins.outputs.web }}
          path: .contract-sources/web
      - run: python -m pip install uv==0.11.3
      - run: uv sync --locked --no-cache --python 3.12 --extra dev --extra build
      - name: Complete desktop and cross-product suite
        env:
          WUWATERM_CORE_ROOT: ${{ github.workspace }}/.contract-sources/core
          WUWATERM_WEB_ROOT: ${{ github.workspace }}/.contract-sources/web
          WUWATERM_CONTRACTS_REQUIRED: '1'
        run: .venv/Scripts/python.exe -m pytest
      - name: Build and inspect Python distribution artifacts
        run: |
          uv build --no-cache --out-dir dist
          .venv/Scripts/python.exe scripts/check_python_artifacts.py
      - name: Build and self-check the EXE
        shell: pwsh
        run: ./build.ps1
      - name: Validate ZIP and self-check the extracted executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem dist/WuwaTerm-*-windows-x64.zip)
          if ($archives.Count -ne 1 -or $archives[0].Length -le 0) { throw 'Expected one nonempty release ZIP' }
          $version = & .venv/Scripts/python.exe -c "import wuwaterm_client; print(wuwaterm_client.__version__)"
          if ($LASTEXITCODE -ne 0 -or $archives[0].Name -ne "WuwaTerm-$version-windows-x64.zip") { throw 'ZIP version mismatch' }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath "$env:RUNNER_TEMP/wuwaterm-extracted"
          $exe = "$env:RUNNER_TEMP/wuwaterm-extracted/WuwaTerm/WuwaTerm.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw 'ZIP lacks executable' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $check = Start-Process -FilePath $exe -ArgumentList '--self-check' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Extracted executable self-check failed: $($check.ExitCode)" }
      - name: Build residue must be ignored
        shell: bash
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release-zip
          path: dist/WuwaTerm-*-windows-x64.zip
          if-no-files-found: error
